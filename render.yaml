services:
  - type: web
    name: kashii-updatez
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn reqpulse.wsgi:application --workers 2 --threads 4 --worker-class gthread --keep-alive 5 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: reqpulse.settings
      - key: SECRET_KEY
        generateValue: true



