<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board - V4 Industry Standard Filter Example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/jobFilterStyles.v4.css' %}"> <!-- Link to our NEW V4 styles -->
  
  <!-- Lucide Icons for consistent icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="search-container-v4">
    <!-- V4 Industry Standard Search Bar -->
    <div class="search-bar-v4">
      <div class="search-input-group-v4">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="keywordsInputV4" placeholder="Job Title, Keywords, or Company">
      </div>
      <div class="search-input-group-v4 --location">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <input type="text" id="locationInputV4" placeholder="City, State, or Remote">
      </div>
      <button id="searchButtonV4" class="btn-v4 btn-primary-v4" title="Search Jobs">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Search
      </button>
    </div>

    <!-- Top-level Category Section -->
    <div class="categories-section-v4">
      <div id="filterCategoriesV4" class="categories-grid-v4">
          <span class="category-chip-v4 is-active" data-category-value="all">All Opportunities</span>
          <span class="category-chip-v4" data-category-value="freshers">🎓 Fresher Hiring (0-1 Yrs)</span>
          <span class="category-chip-v4" data-category-value="experienced">💼 Experienced (1-5+ Yrs)</span>
          <span class="category-chip-v4" data-category-value="qa-testing">🧪 QA &amp; Testing</span>
          <span class="category-chip-v4" data-category-value="hr-recruitment">👥 HR &amp; Hiring</span>
          <span class="category-chip-v4" data-category-value="mba-business">📈 MBA &amp; Business</span>
          <span class="category-chip-v4" data-category-value="software-tech">💻 Software &amp; Tech</span>
          <span class="category-chip-v4" data-category-value="non-it">📞 Non IT &amp; Ops</span>
      </div>
    </div>

    <!-- Active Filter Tags Display -->
    <div id="activeFiltersContainerV4" class="active-filters-container-v4">
      <span style="color: var(--v4-color-text-muted);">No filters applied.</span>
    </div>

    <!-- More Filters Toggle (placed separately) -->
    <button id="moreFiltersToggleV4" class="more-filters-toggle-v4" title="Toggle Advanced Filters">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01.293.707l3 3A1 1 0 0122 12v6a1 1 0 01-1 1H3a1 1 0 01-1-1v-6a1 1 0 01.293-.707l3-3A1 1 0 013 6.586V4z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 11v-4a3 3 0 016 0v4m-3 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      Advanced Filters
    </button>

    <!-- Filter Panel (Slides down from search container) -->
    <div id="filterPanelV4" class="filter-panel-v4">
        <div class="filter-panel-header-v4">
            <h4>Advanced Search Filters</h4>
            <button id="filterPanelCloseV4" class="filter-panel-close-v4">✕</button>
        </div>

        <div class="filter-grid-v4">
            <div class="filter-group-v4">
                <label for="filterCompanyV4">Company</label>
                <input type="text" id="filterCompanyV4" placeholder="e.g., Stripe, Google">
                <div id="selectedCompaniesV4" class="selected-tags-container-v4"></div>
            </div>
            <div class="filter-group-v4">
                <label>Experience (Years)</label>
                <div class="u-flex u-gap-sm">
                    <input type="number" id="filterMinExperienceV4" placeholder="Min" min="0" max="20">
                    <span>-</span>
                    <input type="number" id="filterMaxExperienceV4" placeholder="Max" min="0" max="20">
                </div>
            </div>
            <div class="filter-group-v4">
                <label for="filterJobTypeV4">Job Type</label>
                <select id="filterJobTypeV4">
                    <option value="all">All Types</option>
                    <option value="INTERNSHIP">Internship</option>
                    <option value="FULL_TIME">Full-Time</option>
                    <option value="PART_TIME">Part-Time</option>
                    <option value="FREELANCE">Freelance</option>
                </select>
            </div>
            <div class="filter-group-v4">
                <label for="filterSortV4">Sort By</label>
                <select id="filterSortV4">
                    <option value="newest">Newest First</option>
                    <option value="deadline">Closing Soon</option>
                </select>
            </div>
        </div>

        <div class="filter-panel-actions-v4">
            <button id="clearFiltersBtnV4" class="btn-v4 btn-clear-v4">Clear All</button>
            <button id="applyFiltersBtnV4" class="btn-v4 btn-apply-v4">Apply Filters</button>
        </div>
    </div>
  </div>

  <!-- Job Listing Grid -->
  <main>
    <div id="jobsGridV4" class="jobs-grid-v4">
    </div>
  </main>

  <script src="{% static 'js/jobFilterModule.v4.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // --- Define your custom job fetching function (V4) ---
      async function myBackendFetchJobsV4(filters) {
        console.log("Fetching jobs with filters (V4):", filters);

        const dummyJobs = [
          {
              title: 'Product Designer',
              company: 'Linear',
              jobType: 'Full-Time',
              description: 'Design intuitive and beautiful user interfaces for our product suite.',
              skills: ['Figma', 'User Research', 'Prototyping', 'Interaction Design'],
              postedDate: '8 hours ago',
              location: 'Remote',
              experienceYears: 3,
              category: 'software-tech',
              link: '#'
          },
          {
              title: 'Staff Software Engineer',
              company: 'Stripe',
              jobType: 'Full-Time',
              description: 'Build and scale critical payment infrastructure.',
              skills: ['Go', 'Java', 'Distributed Systems', 'API Design'],
              postedDate: '1 day ago',
              location: 'Dublin, Ireland',
              experienceYears: 7,
              category: 'software-tech',
              link: '#'
          },
          {
              title: 'Machine Learning Intern',
              company: 'Google AI',
              jobType: 'Internship',
              description: 'Contribute to cutting-edge research in machine learning algorithms.',
              skills: ['Python', 'TensorFlow', 'Deep Learning', 'Research'],
              postedDate: '2 days ago',
              location: 'Mountain View, USA',
              experienceYears: 0,
              category: 'software-tech',
              link: '#'
          },
          {
            title: 'iOS Developer',
            company: 'Apple',
            jobType: 'Full-Time',
            description: 'Develop and maintain high-performance iOS applications.',
            skills: ['Swift', 'Objective-C', 'Xcode', 'UIKit'],
            postedDate: '3 days ago',
            location: 'Cupertino, USA',
            experienceYears: 4,
            category: 'software-tech',
            link: '#'
          },
          {
            title: 'Data Engineer',
            company: 'Netflix',
            jobType: 'Full-Time',
            description: 'Build and optimize data pipelines for large-scale streaming data.',
            skills: ['Spark', 'Scala', 'AWS', 'Kafka'],
            postedDate: '5 days ago',
            location: 'Los Gatos, USA',
            experienceYears: 6,
            category: 'software-tech',
            link: '#'
          },
          {
            title: 'Frontend Developer',
            company: 'Vercel',
            jobType: 'Full-Time',
            description: 'Work on Next.js framework and improve developer experience.',
            skills: ['React', 'Next.js', 'TypeScript', 'Vercel'],
            postedDate: '4 days ago',
            location: 'Remote',
            experienceYears: 3,
            category: 'software-tech',
            link: '#'
          }
        ];

        // Simulate filtering logic
        const filteredJobs = dummyJobs.filter(job => {
            const matchesKeywords = !filters.keywords ||
                job.title.toLowerCase().includes(filters.keywords.toLowerCase()) ||
                job.company.toLowerCase().includes(filters.keywords.toLowerCase()) ||
                job.skills.some(skill => skill.toLowerCase().includes(filters.keywords.toLowerCase()));

            const matchesLocation = !filters.location ||
                job.location.toLowerCase().includes(filters.location.toLowerCase());

            const matchesCompanies = filters.companies.length === 0 ||
                filters.companies.some(comp => job.company.toLowerCase().includes(comp.toLowerCase()));
            
            const jobExperience = job.experienceYears !== undefined ? job.experienceYears : -1;
            const minExp = filters.minExperience ? parseInt(filters.minExperience) : 0;
            const maxExp = filters.maxExperience ? parseInt(filters.maxExperience) : 999; 

            const matchesExperience = (jobExperience >= minExp) && (jobExperience <= maxExp);

            const matchesJobType = filters.jobType === 'all' || job.jobType.toLowerCase() === filters.jobType.toLowerCase();

            const matchesCategories = filters.categories.length === 0 ||
                                      filters.categories.some(cat => job.category && job.category.toLowerCase().includes(cat.toLowerCase()));

            return matchesKeywords && matchesLocation && matchesCompanies && matchesExperience && matchesJobType && matchesCategories;
        });

        // Simulate sorting
        const sortedJobs = filteredJobs.sort((a, b) => {
            if (filters.sortBy === 'deadline') {
                return a.postedDate.localeCompare(b.postedDate);
            } else { // 'newest'
                return b.postedDate.localeCompare(a.postedDate);
            }
        });

        return new Promise(resolve => setTimeout(() => resolve(sortedJobs), 700)); // Simulate API delay
      }

      // --- Define your custom job card rendering function (V4) ---
      function myCustomRenderJobCardV4(job) {
        const jobCard = document.createElement('a');
        jobCard.href = job.link || '#';
        jobCard.target = '_blank';
        jobCard.rel = 'noopener';
        jobCard.className = 'job-card-v4'; // Use new V4 class name
        jobCard.innerHTML = `
            <div class="job-header-v4">
                <span class="company-badge-v4">${job.company || 'N/A'}</span>
                <span class="type-badge-v4">${job.jobType || 'N/A'}</span>
            </div>
            <h4>${job.title || 'Job Title'}</h4>
            <p>${job.description || 'No description available.'}</p>
            <div class="skills-v4">
                ${(job.skills || []).map(skill => `<span class="skill-tag-v4">${skill}</span>`).join('')}
            </div>
            <div class="job-meta-v4">
                <span>📅 ${job.postedDate || 'N/A'}</span>
                <span>📍 ${job.location || 'N/A'}</span>
            </div>
        `;
        return jobCard;
      }

      // --- Initialize the Job Filters Module (V4) ---
      initializeJobFiltersV4({
        keywordsInputId: 'keywordsInputV4',
        locationInputId: 'locationInputV4',
        searchButtonId: 'searchButtonV4',
        moreFiltersToggleId: 'moreFiltersToggleV4',
        filterPanelId: 'filterPanelV4',
        filterPanelCloseId: 'filterPanelCloseV4',
        applyFiltersBtnId: 'applyFiltersBtnV4',
        clearFiltersBtnId: 'clearFiltersBtnV4',
        activeFiltersContainerId: 'activeFiltersContainerV4',
        filterCategoriesContainerId: 'filterCategoriesV4',
        filterCompanyInputId: 'filterCompanyV4',
        selectedCompaniesContainerId: 'selectedCompaniesV4',
        filterMinExperienceId: 'filterMinExperienceV4',
        filterMaxExperienceId: 'filterMaxExperienceV4',
        filterJobTypeModalId: 'filterJobTypeV4',
        filterSortModalId: 'filterSortV4',
        jobsGridId: 'jobsGridV4',
        fetchJobsApiCallback: myBackendFetchJobsV4,
        renderJobCardCallback: myCustomRenderJobCardV4
      });
    });
  </script>
</body>
</html>
