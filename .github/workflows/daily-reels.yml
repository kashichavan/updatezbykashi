name: Daily job reels

# Posts the daily job reels at 9:00, 13:00 and 19:00 IST (03:30, 07:30, 13:30 UTC).
# Render's free plan sleeps, so this wakes the site first, then triggers the post.
# Needs repository secret REELS_CRON_SECRET (same value as the Render env var).
on:
  schedule:
    - cron: '32 3 * * *'
    - cron: '32 7 * * *'
    - cron: '32 13 * * *'
  workflow_dispatch: {}

jobs:
  post-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the site
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://kashiiupdatez.online/ || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
      - name: Trigger due reels
        env:
          SECRET: ${{ secrets.REELS_CRON_SECRET }}
        run: |
          test -n "$SECRET" || { echo "REELS_CRON_SECRET secret is missing"; exit 1; }
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' --max-time 60 -X POST \
            -H "X-Cron-Secret: $SECRET" https://kashiiupdatez.online/internal/reels/run/)
          cat /tmp/out.txt; echo
          test "$code" = "202"
      - name: Keep the site awake while the reel renders and uploads
        run: |
          for i in $(seq 1 8); do sleep 30; curl -s -o /dev/null --max-time 30 https://kashiiupdatez.online/ || true; done
