{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Kashii Updatez — Welcome to Student Careers</title>
  <meta name="description" content="Welcome to Kashii Updatez — Verified student job opportunities, campus recruitment drives, and Python Kashi learning hub.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="shortcut icon" href="{% static 'images/icon-apply.png' %}" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=202608281200">
</head>
<body style="background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f8fafc 100%); margin: 0; padding: 0; overflow: hidden; height: 100vh;">

  <!-- Subtle Film Grain -->
  <div class="site-grain"></div>

  <!-- Apple / Linear Style Kinetic Glowing Vector & Iridescent Beam Entry -->
  <div id="kashiiEntry" style="display: flex;">
    <div class="mesh-glow mesh-1"></div>
    <div class="mesh-glow mesh-2"></div>
    
    <!-- Top Bar Controls -->
    <div class="entry-topbar">
      <span class="entry-badge">
        <span class="pulse-dot"></span> KASHII UPDATEZ &middot; DAILY STUDENT CAREERS
      </span>
      <button id="entrySkipBtn" type="button" aria-label="Skip introduction animation">
        Skip ›
      </button>
    </div>

    <!-- Center Stage: Iridescent Beam Gem + Razor-Sharp Kinetic Wordmark -->
    <div class="entry-center-stage">
      <div class="gem-wrapper">
        <div class="gem-beam-spinner"></div>
        <div class="gem-inner">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#boltGradIntro)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="boltGradIntro" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="0.5" stop-color="#60a5fa"/>
                <stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <h1 id="entryWordmark" class="entry-brand-typography">
        <span class="word-kashii">Kashii</span>
        <span class="word-updatez">Updatez</span>
      </h1>

      <p class="entry-sub-tag">
        Verified 7-Day Student Jobs &middot; Campus Drives &middot; Python Kashi Hub
      </p>
    </div>

    <!-- Bottom HUD Telemetry Card -->
    <div class="entry-hud-card">
      <div class="entry-hud-header">
        <span id="entryStatusText" class="entry-hud-status">Synchronizing 7-Day Live Feed...</span>
        <span id="entryMetricCount" class="entry-hud-count">0%</span>
      </div>
      <div class="entry-progress-track">
        <div id="entryProgressFill" class="entry-progress-fill"></div>
      </div>
    </div>
  </div>
  <script>
    // Force intro animation on dedicated intro page
    sessionStorage.removeItem('kashiiEntryPlayed');
  </script>
  <script src="{% static 'js/entry_experience.js' %}?v=202608281300"></script>
</body>
</html>
