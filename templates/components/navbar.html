{% load static %}
<header class="site-header">
  <div class="wrap nav">
    <div style="display: flex; align-items: center; gap: 14px;">
      <button id="btnToggleDrawer" class="vp-sidebar-btn" title="Categories Drawer">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        Categories
      </button>

      <a href="/" class="brand">
        Kashii<span>Updatez</span>
      </a>
    </div>

    <nav class="nav-links">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">
        <img src="{% static 'images/icon-feed.png' %}" class="nav-icon" alt="Feed" width="18" height="18" decoding="async">
        Student Feed
      </a>
      <a href="/debugger/" class="{% if '/debugger' in request.path %}active{% endif %}" style="color: #2563eb; font-weight: 800;">
        <img src="{% static 'images/icon-apply.png' %}" class="nav-icon" alt="Debugger" width="18" height="18" decoding="async">
        Code Debugger
      </a>
      <a href="/about/" class="{% if request.path == '/about/' %}active{% endif %}">
        <img src="{% static 'images/icon-about.png' %}" class="nav-icon" alt="About" width="18" height="18" decoding="async">
        About Kashii
      </a>
      <a href="https://www.youtube.com/@pythonkashi" target="_blank" rel="noopener" style="color: #dc2626; font-weight: 700;">
        <img src="{% static 'images/icon-youtube.png' %}" class="nav-icon" alt="YouTube" width="18" height="18" decoding="async">
        Python Kashi
      </a>
    </nav>
  </div>
</header>

<!-- Off-Canvas Category Side Drawer -->
<div id="drawerOverlay" class="vp-drawer-overlay">
  <div class="vp-side-drawer">
    <div class="vp-drawer-header">
      <a href="/" class="brand">Kashii<span>Updatez</span></a>
      <button id="btnCloseDrawer" class="vp-drawer-close">✕</button>
    </div>
    <div class="vp-drawer-body">
      <div class="drawer-section-title">Explore Categories</div>
      <div id="drawerCategoryNav" class="drawer-nav">
        <!-- Populated via JS -->
      </div>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--subtle-border);">
        <div class="drawer-section-title">Visual Tools &amp; Connect</div>
        <a href="/debugger/" class="drawer-link" style="color: #2563eb; font-weight: 800;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img src="{% static 'images/icon-apply.png' %}" class="nav-icon" alt="Debugger" width="18" height="18" decoding="async">
            Visual Code Debugger
          </span>
          <span class="d-tag" style="background:#dbeafe; color:#1d4ed8;">IDE</span>
        </a>
        <a href="https://www.youtube.com/@pythonkashi" target="_blank" rel="noopener" class="drawer-link" style="color: #dc2626; font-weight: 700; margin-top: 6px;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img src="{% static 'images/icon-youtube.png' %}" class="nav-icon" alt="YouTube" width="18" height="18" decoding="async">
            YouTube (@pythonkashi)
          </span>
          <span class="d-tag" style="background:#fee2e2; color:#dc2626;">Sub</span>
        </a>
        <a href="https://www.instagram.com/ikashii_07/?hl=en" target="_blank" rel="noopener" class="drawer-link" style="color: #e1306c; font-weight: 700; margin-top: 6px;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img src="{% static 'images/icon-chat.png' %}" class="nav-icon" alt="Instagram" width="18" height="18" decoding="async">
            Instagram (@ikashii_07)
          </span>
          <span class="d-tag" style="background:#fce7f3; color:#be185d;">Follow</span>
        </a>
      </div>
    </div>
  </div>
</div>
