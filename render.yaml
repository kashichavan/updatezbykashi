services:
  - type: web
    name: kashii-updatez
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn reqpulse.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: reqpulse.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kashii-updatez-db
          property: connectionString

databases:
  - name: kashii-updatez-db
    plan: free
    databaseName: kashii_updatez_db
    user: kashii_user
