services:
  - type: web
    name: kashii-updatez
    env: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: "./build.sh"
    startCommand: "gunicorn reqpulse.wsgi:application --workers 1 --threads 4 --worker-class gthread --keep-alive 5 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: reqpulse.settings
      - key: SECRET_KEY
        generateValue: true



      # SEO & analytics IDs: set the values in the Render dashboard (Environment tab)
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: CLARITY_PROJECT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
